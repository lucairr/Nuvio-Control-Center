# Self-hosted Docker/NAS variant; 127.0.0.1 only unless deliberately changed.
# Requires one-time bootstrap + password + TV pairing (see docs/INSTALL_DOCKER.md).
services:
  dashboard:
    build: .
    image: nuvio-control-center:local
    restart: unless-stopped
    environment: &nuvio_env
      NUVIO_HOME: /data
      HOME: /data
      PYTHONDONTWRITEBYTECODE: "1"
      TZ: ${TZ:-Europe/Rome}
    volumes: &nuvio_volumes
      - nuvio_data:/data
    ports:
      - "127.0.0.1:8765:8765"
    read_only: true
    tmpfs:
      - /tmp
  scheduler:
    image: nuvio-control-center:local
    build: .
    restart: unless-stopped
    environment: *nuvio_env
    volumes: *nuvio_volumes
    command: ["python3", "-m", "nuvio.scheduler"]
    read_only: true
    tmpfs:
      - /tmp
volumes:
  nuvio_data:
