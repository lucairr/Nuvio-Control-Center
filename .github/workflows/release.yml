name: Release archives
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check tag matches code version
        run: |
          CODE_VERSION=$(python3 -c "import re;print(re.search(r\"VERSION = '([^']+)'\", open('nuvio/core.py').read()).group(1))")
          if [ "v$CODE_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION=$CODE_VERSION in nuvio/core.py"; exit 1
          fi
          grep -q "## $CODE_VERSION" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $CODE_VERSION"; exit 1; }
      - name: Test updater and build public archives
        run: |
          python3 -m unittest discover -s tests -v
          bash -n install.sh uninstall.sh scripts/connect-tv-linux.sh
          python3 scripts/build-release.py
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/Nuvio-Control-Center-v*.zip dist/Nuvio-Control-Center-v*.tar.gz dist/Nuvio-Control-Center-v*-SHA256SUMS.txt --verify-tag --generate-notes --notes "Nuvio Control Center is free and open source. If it saves you time, you can support it on [Ko-fi](https://ko-fi.com/lucairr)." $PRE --title "Nuvio Control Center $GITHUB_REF_NAME"
