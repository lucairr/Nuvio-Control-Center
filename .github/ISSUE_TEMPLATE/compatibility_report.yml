name: Compatibility report (it works!)
description: Tell us a host + TV combination that works, to grow the hardware matrix
labels: [compatibility]
body:
  - type: input
    id: host
    attributes:
      label: Host (OS + CPU architecture)
      placeholder: "Windows 11 x64 / Debian 12 VM / Ubuntu 24.04 mini PC"
    validations:
      required: true
  - type: input
    id: tv
    attributes:
      label: TV model and webOS version
    validations:
      required: true
  - type: checkboxes
    id: tested
    attributes:
      label: What did you test?
      options:
        - label: Check for updates
        - label: Install update
        - label: Automatic daily update
        - label: Downgrade
